name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild pages from content sources
        run: node build.mjs

      - name: Fail if generated pages are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Les pages generees ne correspondent pas au contenu. Lancez 'node build.mjs' et committez le resultat."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Check required pages
        run: |
          set -euo pipefail
          for locale in "" fr ar es pt
          do
            prefix="${locale:+$locale/}"
            for path in \
              "${prefix}index.html" \
              "${prefix}privacy/index.html" \
              "${prefix}privacy/motsmeles/index.html" \
              "${prefix}privacy/parkingpuzzle/index.html" \
              "${prefix}privacy/qiblafr/index.html" \
              "${prefix}privacy/arcadelab/index.html" \
              "${prefix}privacy/onelinepuzzle/index.html"
            do
              test -f "$path" || { echo "Missing $path"; exit 1; }
            done
          done
          for path in assets/styles.css assets/main.js assets/jellyfish.js assets/favicon.svg sitemap.xml robots.txt
          do
            test -f "$path" || { echo "Missing $path"; exit 1; }
          done
          echo "All required pages present."

  deploy:
    name: Deploy Vercel
    needs: validate
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.VERCEL_READY != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret manquant: $name — voir README.md"
              missing=1
            fi
          done
          exit $missing

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
